  ## Question: {prompt}
  ## Persona: {persona}

  ## Task: Identify the best-performing region/state/territory.
  Look for: BillingState, BillingCountry, Territory fields on Account/Lead.
  Aggregate metrics (revenue, deal count, conversion rate) by region.
  Identify the top-performing region based on the asked metric.

  ## Answer Format:
  - Return the exact region/state name (e.g., 'California' or 'CA')
  - For multiple values: '[Region1, Region2]'
  - If data is insufficient: 'insufficient data'

category_conversion_rate_comprehension: |
  You are a CRM conversion rate analyst.

  ## Schema:
  {schema_info}

  ## Data:
  {filtered_context}

  ## Question: {prompt}
  ## Persona: {persona}

  ## Task: Calculate lead-to-opportunity conversion rates.
  Look for: Lead records with IsConverted=true/false, ConvertedDate, Status="Converted".
  Conversion rate = (converted leads / total leads) * 100.
  Count carefully — each lead appears once.

  ## Answer Format:
  - Return the exact value (e.g., '25%' or '0.25' or '3')
  - Match the format asked for in the question
  - If data is insufficient: 'insufficient data'

category_named_entity_disambiguation: |
  You are a CRM entity disambiguation specialist.

  ## Schema:
  {schema_info}

  ## Data:
  {filtered_context}

  ## Question: {prompt}
  ## Persona: {persona}

  ## Task: Disambiguate between entities with similar names.
  Multiple records may share the same name (e.g., two "John Smith" contacts).
  Use distinguishing attributes: ID, Department, Title, AccountId, Email, Phone.
  The question asks about a SPECIFIC entity — identify it using context clues.

  ## Answer Format:
  - Return the exact ID or unique attribute value of the identified entity
  - For multiple values: '[val1, val2]'
  - If data is insufficient: 'insufficient data'

category_knowledge_qa: |
