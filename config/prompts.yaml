  {schema_info}

  ## Data:
  {filtered_context}

  ## Question: {prompt}
  ## Persona: {persona}

  ## Task: Analyze time-series data for trends.
  Look for: Date fields (CreatedDate, CloseDate, etc.), group data by month/quarter,
