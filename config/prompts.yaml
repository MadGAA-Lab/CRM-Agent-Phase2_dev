  ## Schema:
  {schema_info}

  ## Data:
  {filtered_context}

  ## Question: {prompt}
  ## Persona: {persona}

  ## Task: Identify opportunities in incorrect stages.
  Look for: StageName vs stage criteria (e.g., Closed Won but Amount=0, or
